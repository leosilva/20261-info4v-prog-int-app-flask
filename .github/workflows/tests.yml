name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: labinfo
          MYSQL_DATABASE: 2026-info4v
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plabinfo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USERNAME: root
      DB_PASSWORD: labinfo
      SECRET_KEY: chave-secreta-ci

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Executar migrações
        run: python -m flask --app run:app db upgrade

      - name: Iniciar aplicação
        run: |
          python -m flask --app run:app run \
            --host=127.0.0.1 \
            --port=5000 > flask.log 2>&1 &

      - name: Aguardar aplicação
        run: |
          curl --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:5000/

      - name: Executar testes
        run: python -m unittest discover -s tests -v
