name: Testes

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: chave-secreta-ci
      CURRENT_DATABASE: sqlite

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Executar migrações
        run: python -m flask --app run:app db upgrade

      - name: Iniciar aplicação
        run: |
          python -m flask --app run:app run \
            --host=127.0.0.1 \
            --port=5000 > flask.log 2>&1 &

      - name: Aguardar aplicação
        run: |
          curl --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:5000/

      - name: Executar testes
        run: python -m unittest discover -s tests -p "test_*.py" -v
