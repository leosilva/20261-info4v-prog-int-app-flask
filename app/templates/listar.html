{% extends "base.html" %}

{% block content %}
    <section class="py-5">
        <div class="container px-5 my-5">
            <h2>Lista de Usuários</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                {% for usuario in usuarios %}
                        <tr>
                            <td>{{ usuario.username }}</td>
                            <td>{{ usuario.email }}</td>
                            <td>
                                <a href="{{ url_for('editar', id=usuario.id) }}">Editar</a> -
                                <a href="{{ url_for('remover', id=usuario.id) }}">Remover</a>
                            </td>
                        </tr>
                {% else %}
                        <tr>
                            <td colspan="3">Nenhum usuário cadastrado</td>
                        </tr>
                {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </section>
{% endblock %}
