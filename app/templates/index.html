{% extends "base.html" %}

{% block title %}Página Inicial{% endblock %}

{% block content %}
    <section class="py-5">
        <div class="container px-5 my-5">
            {% if current_user.is_authenticated %}
                <h1>Bem-vindo(a), {{ current_user.username }}!</h1>
            {% else %}
                <h1>Faça o login para continuar.</h1>
            {% endif %}
        </div>
    </section>
{% endblock %}
