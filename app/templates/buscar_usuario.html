{% extends "base.html" %}

{% block title %}Buscar Usuário{% endblock %}

{% block content %}
    <section class="py-5">
        <div class="container px-5 my-5">
    <h1>Buscar Usuário</h1>
    <form action="buscar" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.email.label }} <br/>
            {{ form.email(size=32) }} <br/>
        </p>
        <p>{{ form.submit() }}</p>
    </form>
        </div>
    </section>
{% endblock %}
